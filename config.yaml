# Paths relative to project root (ragZone/) unless absolute.
data_dir: ./data
uploads_subdir: uploads
chroma_subdir: chroma
sqlite_filename: rag_lite.db
collection_name: rag_lite

ollama:
  base_url: http://127.0.0.1:11434
  # 默认模型；界面下拉会与 Ollama /api/tags 合并，并记住上次选择（data/ui_preferences.json）
  llm_model: qwen2.5:0.5b
  embed_model: bge-m3
  # 可选：预置多候选名（与 ollama 列表合并，便于对比实验）
  # llm_models:
  #   - qwen2.5:7b
  # embed_models:
  #   - bge-m3
  # 对话流式生成：读超时过短易 httpx.ReadTimeout；本机 CPU 慢或上下文长时可再加大
  request_timeout: 600.0
  connect_timeout: 60.0
  embed_retry_attempts: 2
  # 部分 Qwen 等模型支持「思考链」；开启时流式可能长时间无正文，界面卡在「正在生成」
  thinking: false
  # 发给 LLM 的用户消息（含检索片段）最大字符数，过大易首 token 极慢或超时
  max_llm_context_chars: 100000
  # 对话请求里的 num_ctx（LlamaIndex 的 context_window）。Modelfile 若设成 26 万级易吃满显存并回退 CPU；
  # 工作台默认用较小值更易走 GPU；需要更大可改为 32768、65536，或 -1 表示跟随模型/服务端
  num_ctx: 16384

ingest:
  max_file_size_mb: 50
  # 验证环境默认先关闭图片增强，优先保证构建速度与主流程稳定；需要验证图片内容时再手动开启
  # 为 true 时：PDF/DOCX 内嵌图先 OCR（ingest.ocr_engine：tesseract / paddleocr），文本过短再调 Ollama 视觉模型；需对应依赖与 pull 视觉模型
  image_enrichment: false
  vision_model: glm-ocr:latest
  vision_prompt: "请用1-3句中文简要描述图中内容，便于检索；若有文字请尽量读出关键信息。"
  # OCR 字符数 ≥ 此值则不再调用视觉模型（节省构建时间）
  ocr_skip_vlm_min_chars: 8
  max_images_per_file: 5
  min_image_side_px: 24
  max_image_side_px: 768
  # OCR 引擎：tesseract | paddleocr（Paddle 需单独安装，见 requirements-paddleocr.txt）
  ocr_engine: tesseract
  tesseract_lang: chi_sim+eng
  # Chroma HNSW 持久化参数：Windows 下取过大值会触发巨量内存申请，导致只写出 sqlite 而 HNSW 文件不完整。
  # 这里改回保守值，优先保证索引能真正落盘并可查询；需要更高吞吐时再逐步上调。
  chroma_hnsw_sync_threshold: 1000
  chroma_hnsw_batch_size: 100
  # Windows 若未把 tesseract 加入 PATH，可填绝对路径，例如：
  # tesseract_cmd: "C:/Program Files/Tesseract-OCR/tesseract.exe"

rerank:
  enabled_default: false
  model_name: BAAI/bge-reranker-v2-m3
  device: null

retrieval:
  top_n_default: 30
  top_k_default: 8

chunking:
  chunk_size_default: 384
  chunk_overlap_default: 128

prompt:
  version: "v1"
  system_default: |
    你是一个严谨的助手。请仅根据下面「已知上下文」回答问题；若上下文没有相关信息，请明确说「根据已知材料无法回答」，不要编造。

ui:
  server_name: 127.0.0.1
  server_port: 7860
  share: false
  open_browser: true
